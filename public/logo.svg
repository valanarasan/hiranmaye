<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lotusGoldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Playfair+Display:wght@700&amp;display=swap');
      .title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 52px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .tagline {
        font-family: 'Alex Brush', cursive;
        font-size: 38px;
        font-style: italic;
        fill: #FFFFFF;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0C1427"/>

  <!-- Golden Lotus Symbol (Centered) -->
  <g transform="translate(325, 140) scale(1.5)" stroke="url(#lotusGoldGradFull)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Upright Petal -->
    <path d="M 50 62 C 43 47, 43 27, 50 16 C 57 27, 57 47, 50 62 Z" />

    <!-- Inner Left Petal -->
    <path d="M 50 62 C 38 52, 34 32, 44 20 C 49 32, 49 48, 50 62 Z" />

    <!-- Inner Right Petal -->
    <path d="M 50 62 C 62 52, 66 32, 56 20 C 51 32, 51 48, 50 62 Z" />

    <!-- Outer Left Petal -->
    <path d="M 50 62 C 30 57, 22 41, 33 27 C 39 39, 45 52, 50 62 Z" />

    <!-- Outer Right Petal -->
    <path d="M 50 62 C 70 57, 78 41, 67 27 C 61 39, 55 52, 50 62 Z" />

    <!-- Left Wing Petal -->
    <path d="M 18 42 C 22 40, 34 40, 42 47" />

    <!-- Right Wing Petal -->
    <path d="M 82 42 C 78 40, 66 40, 58 47" />

    <!-- Bottom Cradle Arc -->
    <path d="M 18 42 C 22 58, 36 67, 50 67 C 64 67, 78 58, 82 42" />
  </g>

  <!-- Typography -->
  <text x="400" y="360" class="title">Hiranmaye Digital</text>
  <text x="400" y="420" class="tagline">Strategy drives growth</text>
</svg>
